<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Contraseña</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atomic+Age&family=Audiowide&family=Bruno+Ace+SC&display=swap" rel="stylesheet">
  <link rel="icon" href="img/icon/favicon-32x32.png" type="image/png">
</head>

<body>
  <div class="contenedor">
    <h1 class="contenedor__h1">Generador de Contraseña</h1>
    <div class="contenedor__div">
      <label for="longitud">Longitud de la contraseña:</label>
      <input type="number" id="longitud" value="8">
    </div>
    <div class="contenedor__div">
      <input type="checkbox" class="contenedor__checkbox" id="agregarMinusculas">
      <label for="agregarMinusculas">Incluir letras minúsculas</label>
    </div>
    <div class="contenedor__div">
      <input type="checkbox" class="contenedor__checkbox" id="agregarMayusculas">
      <label for="agregarMayusculas">Incluir letras mayúsculas</label>
    </div>
    <div class="contenedor__div">
      <input type="checkbox" class="contenedor__checkbox" id="agregarNumeros">
      <label for="agregarNumeros">Incluir números</label>
    </div>
    <div class="contenedor__div">
      <input type="checkbox" class="contenedor__checkbox" id="agregarSimbolos">
      <label for="agregarSimbolos">Incluir caracteres especiales</label>
    </div>
    <input type="button" value="Generar" class="btnGenerar" id="btnGenerar">
    <div class="mostrar">
      <input type="text" id="password">
    </div>
  </div>

  <script src="js/script.js"></script>
</body>

</html>
